<header class="shadow-md p-3 w-full max-h-20 fixed top-0 z-50 bg-white">
 <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
 <img  routerLink="/" src="images/logo.png" alt="app Logo" class="max-h-16">
 <nav class="flex gap-3 my-2 uppercase text-xl">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
  <a routerLink="/shop" routerLinkActive="active">Shop</a>
  <a routerLink="/test-error" routerLinkActive="active">error</a>
 </nav>
 <div class="flex gap-3 align-middle">
 <a routerLink="/cart" matBadge="{{cartService.itemCount()}}" matBadgeSize="large" class="custom-badge mt-2 mr-2 ">
    <mat-icon>shopping_cart</mat-icon>
 </a>
 @if(accountService.currentUser()){
   <button mat-buttton [mat-menu-trigger-for]="menu">
      <mat-icon>arrow_drop_down</mat-icon>
      <span>{{accountService.currentUser()?.email}}</span>
   </button>
 }
 @else {
 <button routerLink="/register" mat-stroked-button>Register</button>
 <button routerLink="/login" mat-stroked-button>Login</button>
 }
 
 </div>
 </div>
</header>
@if(busyservice.loading){
   <div class="overlay">
   <mat-progress-spinner mode="indeterminate" class="fixed top-20 z-50"></mat-progress-spinner>
</div>
}
<mat-menu #menu="matMenu">
   <button mat-menu-item class="px-3" routerLink="/cart">
      <mat-icon>shopping_cart</mat-icon>
      <span>My Cart</span>
   </button>
    <button mat-menu-item class="px-3" routerLink="/order">
      <mat-icon>history</mat-icon>
      <span>My Orders</span>
   </button>
   <mat-divider></mat-divider>
   <button mat-menu-item class="px-3" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
   </button>

</mat-menu>
